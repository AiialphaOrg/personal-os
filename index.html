<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Personal OS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Personal OS</title>
    <style>
      #pos-inline-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #09090b;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        z-index: 99999;
      }
      .pos-splash-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #18181b;
        border: 1px solid #27272a;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .pos-splash-title {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
        color: #f4f4f5;
      }
      .pos-splash-sub {
        font-size: 11px;
        font-weight: 600;
        color: #71717a;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-top: 4px;
      }
      .pos-splash-bar {
        width: 80px;
        height: 2px;
        background: #27272a;
        border-radius: 999px;
        margin-top: 20px;
        overflow: hidden;
        position: relative;
      }
      .pos-splash-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: #3b82f6;
        animation: pos-load 1.2s infinite ease-in-out;
      }
      @keyframes pos-load {
        0% { left: -100%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="pos-inline-splash">
      <div class="pos-splash-logo">
        <svg width="34" height="34" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="32" stroke="#3f3f46" stroke-width="3" stroke-dasharray="120 40" stroke-linecap="round" />
          <circle cx="50" cy="50" r="32" stroke="#3b82f6" stroke-width="4" stroke-dasharray="70 130" stroke-linecap="round" />
          <circle cx="50" cy="50" r="20" stroke="#2563eb" stroke-width="2.5" opacity="0.6" />
          <circle cx="50" cy="50" r="10" fill="#3b82f6" />
          <circle cx="47" cy="47" r="2.5" fill="#ffffff" opacity="0.9" />
        </svg>
      </div>
      <p class="pos-splash-title">Personal <span style="color:#3b82f6;">OS</span></p>
      <p class="pos-splash-sub">Clarity & Wealth</p>
      <div class="pos-splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
